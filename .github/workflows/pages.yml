name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 同時に走らないようにする（実行中のデプロイは中断しない）
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      # ビルド工程がないので、リポジトリの中身をそのまま配信する。
      # ただし配信不要なものは除いておく。
      - name: 配信するファイルを集める
        run: |
          mkdir -p _site
          cp index.html mock_profiles.csv _site/
          cp -r assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
